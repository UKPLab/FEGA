# transformer-lens = "2.11.0"
# sae_lens = "5.4.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.2"
nbformat = ">=5.10.4"
ipykernel = ">=6.29.5"
nbstripout = ">=0.7.1"
loguru = ">=0.7.0"
ruff = "^0.9.2"
pyright = "^1.1.392.post0"
pre-commit = "^4.1.0"

[tool.pyright]
typeCheckingMode = "standard"
reportPrivateImportUsage = "none"

[tool.pytest.ini_options]
markers = [
    "local_gpt2_gpu: local opt-in GPU smoke tests for GPT-2 fixtures",
    "real_ravel_gpu: real opt-in GPU smoke tests for RAVEL/Gemma data prep",
]

[tool.ruff]
exclude = ["dist", "docs", "*.ipynb"]

[tool.ruff.lint]
ignore = ["E203", "E501", "E731", "F722", "F821", "ARG001", "ARG005"]
extend-select = ["UP", "TID", "I", "F", "E", "ARG"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Union".msg = "Use `|` instead"
"typing.Optional".msg = "Use `| None` instead"
"typing.Dict".msg = "Use `dict` instead"
"typing.Tuple".msg = "Use `tuple` instead"
"typing.List".msg = "Use `list` instead"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:tool.poetry.version",
    "pyproject.toml:project.version",
]
branch = "main"
build_command = "pip install poetry && poetry build"
