[tool.poetry]
name = "fega"
version = "0.4.2"
description = "Feature Effect Geometry Analysis for sparse autoencoders"
authors = ["Phu Gia Hoang", "Anwoy Chatterjee"]
maintainers = ["Phu Gia Hoang <phu.hoang@tu-darmstadt.de>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "fega" }, { include = "sae_bench", from = "external" }]
include = [
    { path = "fega/core/vmf/backend_policy.json", format = ["sdist", "wheel"] },
    { path = "LICENSE", format = ["sdist", "wheel"] },
    { path = "NOTICE", format = ["sdist", "wheel"] },
    { path = "CITATION.cff", format = ["sdist", "wheel"] },
    { path = "THIRD_PARTY_LICENSES/spherecluster-MIT.txt", format = ["sdist", "wheel"] },
]
homepage = "https://github.com/UKPLab/FEGA"
repository = "https://github.com/UKPLab/FEGA"
keywords = ["sparse-autoencoders", "mechanistic-interpretability", "feature-effect-geometry"]
classifiers = ["Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project]
name = "fega"
version = "0.4.2"
description = "Feature Effect Geometry Analysis for sparse autoencoders"
readme = "README.md"
authors = [
    { name = "Phu Gia Hoang" },
    { name = "Anwoy Chatterjee" },
]
maintainers = [
    { name = "Phu Gia Hoang", email = "phu.hoang@tu-darmstadt.de" },
]
license = { file = "LICENSE" }
requires-python = ">=3.10,<4.0"
dependencies = [
    "sae-lens>=5.4.0,<6.0.0",
    "transformers==4.44.1",
    "transformer-lens>=2.0.0",
    "torch==2.10.0+cu128",
    "einops>=0.8.0",
    "numpy>=1.26.4,<2.0",
    "pandas>=2.1.2",
    "tqdm>=4.66.4",
    "jaxtyping>=0.2.25",
    "beartype>=0.14.1",
    "scikit-learn>=1.5.2",
    "scipy>=1.11",
    "threadpoolctl>=3.6,<4.0",
    "umap-learn>=0.5.6,<0.6",
    "spherecluster>=0.1.7",
    "collectibles>=0.1.5",
    "pydantic>=2.9.2",
    "seaborn>=0.13.2",
    "plotly>=5.22.0",
    "matplotlib>=3.8.4",
    "tabulate>=0.9.0",
    "openai>=1.0.0",
    "torchvision==0.25.0+cu128",
    "nltk>=3.8",
]

[project.urls]
Homepage = "https://github.com/UKPLab/FEGA"
Repository = "https://github.com/UKPLab/FEGA"
Issues = "https://github.com/UKPLab/FEGA/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2",
    "nbformat>=5.10.4",
    "ipykernel>=6.29.5",
    "nbstripout>=0.7.1",
    "loguru>=0.7.0",
    "ruff>=0.9.2,<0.10.0",
    "pyright>=1.1.392.post0,<2.0.0",
    "pre-commit>=4.1.0,<5.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.poetry.dependencies]
python = "^3.10,"
sae_lens = "^5.4.0"
transformers = "==4.44.1"
transformer-lens = ">=2.0.0"
torch = "==2.10.0+cu128"
einops = ">=0.8.0"
numpy = ">=1.26.4,<2.0"
pandas = ">=2.1.2"
tqdm = ">=4.66.4"
jaxtyping = ">=0.2.25"
beartype = ">=0.14.1"
scikit-learn = ">=1.5.2"
scipy = ">=1.11"
threadpoolctl = ">=3.6,<4.0"
umap-learn = ">=0.5.6,<0.6"
spherecluster = ">=0.1.7"
collectibles = ">=0.1.5"
pydantic = ">=2.9.2"
seaborn = ">=0.13.2"
plotly = ">=5.22.0"
matplotlib = ">=3.8.4"
tabulate = ">=0.9.0"
openai = ">=1.0.0"
torchvision = "==0.25.0+cu128" # required for what I believe are nnsight related issues
nltk = ">=3.8"

